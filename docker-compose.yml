services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SCENES_DATABASE_URL: ${SCENES_DATABASE_URL:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - quiz_data:/app/backend/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  quiz_data:
